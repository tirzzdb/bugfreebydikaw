<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050a12"><title>DIKAW</title><style>
@font-face{font-family:Share;src:url('fonts/ShareTechMono-Regular.ttf')}@font-face{font-family:Orbit;src:url('fonts/Orbitron-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#050a12;color:#deeeFB;font-family:Share,monospace;min-height:100vh}.bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#050a12}.bg video{width:100%;height:100%;object-fit:cover;opacity:.28;filter:saturate(.8) brightness(.65)}.shade{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(5,10,18,.72),rgba(5,10,18,.94))}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);background:rgba(14,30,53,.9);border:1px solid #1e3f6e;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0009;backdrop-filter:blur(12px)}.logo{width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 18px #2370be88)}h1,h2{font-family:Orbit;text-align:center;margin:6px 0 10px}.sub{text-align:center;color:#6a92b8;margin-bottom:22px}.field{margin:12px 0}label{display:block;color:#7ab4e8;margin-bottom:7px;font-size:13px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #162b4a;background:#0a1525;color:#deeeFB;outline:none;font:inherit}input:focus{border-color:#4a94e8}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#4a94e8;color:#050a12;font:700 14px Share;cursor:pointer;margin-top:8px}.btn.alt{background:transparent;color:#7ab4e8;border:1px solid #1e3f6e}.msg{min-height:20px;text-align:center;color:#ef4444;margin:10px 0}.hidden{display:none!important}.app{min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#0a1525dd;border-bottom:1px solid #162b4a;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.brand{font-family:Orbit;font-weight:700;color:#deeeFB}.brand small{display:block;font:12px Share;color:#6a92b8;margin-top:2px}.logout{border:1px solid #1e3f6e;background:transparent;color:#7ab4e8;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:22px}.hero{position:relative;border:1px solid #1e3f6e;border-radius:18px;overflow:hidden;min-height:180px;background:#0a1525;margin-bottom:18px}.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#050a12e8,#050a1280)}.heroText{position:relative;z-index:1;padding:28px}.heroText h2{text-align:left;font-size:25px;margin:0 0 8px}.heroText p{color:#9cb9d5;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{border:1px solid #162b4a;background:#0e1e35dd;border-radius:15px;padding:17px;min-height:115px;cursor:pointer;transition:.18s}.tile:hover{transform:translateY(-2px);border-color:#4a94e8;box-shadow:0 10px 30px #0005}.ico{font-size:25px}.tile b{display:block;color:#deeeFB;margin:9px 0 5px}.tile span{color:#6a92b8;font-size:12px}.section{margin:22px 0 10px;color:#7ab4e8;font-family:Orbit;font-size:13px}.panel{margin-top:16px;border:1px solid #162b4a;background:#0a1525dd;border-radius:15px;padding:18px}.status{color:#22c55e}.toast{position:fixed;right:18px;bottom:18px;background:#0e1e35;border:1px solid #1e3f6e;border-radius:10px;padding:12px 15px;display:none;z-index:20}
</style></head><body><div class="bg"><video id="bgVideo" autoplay muted loop playsinline src="assets/videos/background.mp4"></video></div><div class="shade"></div><div id="login" class="screen"><div class="card"><img class="logo" src="assets/images/logo.png"><h1>DIKAW</h1><div class="sub">LOCAL ACCESS PANEL</div><div class="field"><label>USERNAME</label><input id="user" autocomplete="username"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" autocomplete="current-password"></div><div id="msg" class="msg"></div><button class="btn" onclick="login()">LOGIN</button><button class="btn alt" onclick="register()">BUAT AKUN</button></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">DIKAW<small id="who"></small></div><button class="logout" onclick="logout()">KELUAR</button></header><main class="wrap"><section class="hero"><video autoplay muted loop playsinline src="assets/videos/banner.mp4"></video><div class="heroText"><h2>WELCOME TO DIKAW</h2><p>Base web lokal — akun dan sesi tersimpan di browser ini.</p></div></section><div class="section">MAIN MENU</div><div id="grid" class="grid"></div><div class="panel"><b>ACCOUNT</b><p>Username: <span id="account" class="status"></span></p><p>Mode: <span class="status">LOCAL</span></p></div></main></div><div id="toast" class="toast"></div><script>
const menus=[['🐛','BUG GROUP','Bug group menu'],['⚡','BUG SENDER','Bug sender menu'],['📱','DEVICE DASHBOARD','Device dashboard'],['🛠️','TOOLS GATEWAY','Tools gateway'],['🌐','DOMAIN','Domain tools'],['📡','IP SCANNER','IP scanner'],['🔎','PHONE LOOKUP','Phone lookup'],['📶','WIFI INTERNAL','WiFi internal'],['📶','WIFI EXTERNAL','WiFi external'],['🔌','PORT SCANNER','Port scanner'],['💬','CHAT ROOM','Chat room'],['🔔','NOTIFICATION','Notification'],['👤','PROFILE','Profile'],['🔑','CHANGE PASSWORD','Change password'],['📊','DASHBOARD','Dashboard'],['📨','CONTACT','Contact'],['🎵','TIKTOK','TikTok'],['📸','INSTAGRAM','Instagram'],['🎬','DRACIN','Dracin'],['📖','AL QURAN','Al Quran'],['🧾','RIWAYAT','Riwayat'],['✉️','EMAIL OSINT','Email tools'],['🪪','NIK CHECK','NIK check'],['🛡️','ADMIN','Admin menu'],['👑','OWNER','Owner menu'],['🏪','SELLER','Seller menu'],['🧩','CUSTOM PAYLOAD','Custom payload'],['📲','QR GENERATOR','QR generator'],['🐍','ULAR','Ular'],['🔞','HENTAI','Content menu'],['💥','DDoS WIFI','Network action menu']];
const $=id=>document.getElementById(id);function getAcct(){try{return JSON.parse(localStorage.getItem('dikaw_account')||'null')}catch{return null}}function register(){let u=prompt('Username baru:');if(!u)return;let p=prompt('Password baru:');if(!p)return;if(u.trim().length<3||p.length<4){show('Username min. 3 dan password min. 4 karakter');return}localStorage.setItem('dikaw_account',JSON.stringify({u:u.trim(),p}));show('Akun berhasil dibuat');$('user').value=u.trim();$('pass').value='';}function login(){let a=getAcct(),u=$('user').value.trim(),p=$('pass').value;if(!a){show('Buat akun terlebih dahulu');return}if(u!==a.u||p!==a.p){show('Username atau password salah');return}localStorage.setItem('dikaw_session',u);openApp(u)}function openApp(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='USER: '+u;$('account').textContent=u;let g=$('grid');g.innerHTML='';menus.forEach((m,i)=>{let d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="ico">${m[0]}</div><b>${m[1]}</b><span>${m[2]}</span>`;d.onclick=()=>show(m[1]+' tersedia di panel ini');g.appendChild(d)})}function logout(){localStorage.removeItem('dikaw_session');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pass').value=''}function show(t){let x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',2200)}let s=localStorage.getItem('dikaw_session'),a=getAcct();if(s&&a&&s===a.u)openApp(s);$('bgVideo').play().catch(()=>{});
</script></body></html>
